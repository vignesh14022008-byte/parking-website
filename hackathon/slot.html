const client = supabase.createClient(supabaseUrl, supabaseKey);
const selected = JSON.parse(localStorage.getItem("selected_slot"));
console.log("Selected Slot:", selected);
 async function checkAvailability() {
    
  const startTime = document.getElementById("startTime").value;
  const endTime = document.getElementById("endTime").value;
  const slotId = localStorage.getItem("slot_id");

  if (!startTime || !endTime) {
    alert("Select time first");
    return;
  }

  const { data, error } = await client.rpc('get_slots_with_count', {
    start_time: startTime,
    end_time: endTime
  });

  if (error) {
    console.log(error);
    return;
  }

  const selected = data.find(s => s.id === slotId);
  if (!selected) {
    alert("Slot not found");
    return;
  }

  document.getElementById("result").innerHTML = `
    <h3>${selected.title}</h3>
    <p>${selected.available_slots} slots available</p>
    <button onclick="bookNow()">Book Now</button>
  `;
}
async function bookNow() {
  const slotId = localStorage.getItem("slot_id");
  const startTime = document.getElementById("startTime").value;
  const endTime = document.getElementById("endTime").value;
  localStorage.setItem("start_time", startTime);
localStorage.setItem("end_time", endTime);

  const { error } = await client.from('bookings').insert({
   
    slot_id: slotId,
    start_time: startTime,
    end_time: endTime,
    status: 'booked'
  });
if (error) {
  console.log(error);
  alert(error.message);   // 👈 VERY IMPORTANT
}
 else {
  alert("✅ Booking successful! Redirecting to payment...");

  // calculate amount (optional simple version)
  const amount = 50;

  // store for payment page
  localStorage.setItem("payment_amount", amount);
  localStorage.setItem("slot_id", slotId);

  // 👉 redirect
  window.location.href = "payment.html";
}
}
</script>
