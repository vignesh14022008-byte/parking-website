<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parking & Renting Cards</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">

  <style>
    body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  background: linear-gradient(
      180deg,
      #f4efe6 0%,
      #e8e1d5 50%,
      #d8cfc1 100%
  );
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
    .container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      width: 260px;
      border-radius: 15px;
      overflow: hidden;
      background: #f9f6ef;
      border:2px solid#b8a890;
      box-shadow: 0 6px 15px rgba(80,60,30,0.25);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
  transform: scale(1.08);
  box-shadow: 0 12px 25px rgba(70, 50, 20, 0.35);
}

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-text {
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .card {
        width: 90%;
      }
    }
    #bottomm{
      height:50vh;
      background-color: rgb(120, 76, 18);
    }

  </style>
</head>

<body>
<div id="bottomm" ></div>
<div class="container">

  <!-- Parking Card -->
  <div class="card" onclick="goToParking()">
    <img src="https://images.unsplash.com/photo-1506521781263-d8422e82f27a" alt="Parking">
    <div class="card-text">TO PARKING</div>
  </div>

  <!-- Renting Card -->
  <div class="card" onclick="goToRent()">
    <img src="https://images.unsplash.com/photo-1590674899484-d5640e854abe" alt="Renting">
    <div class="card-text">RENTING OUT PARKING</div>
  </div>

</div>

<script>
  function goToParking() {
    window.location.href = "search.html"; // create this page
  }

  function goToRent() {
    window.location.href = "renting.html"; // create this page
  }
</script>

</body>
</html>
